services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hrms
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: hr_user
      POSTGRES_PASSWORD: hr_password
      POSTGRES_DB: hrms_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_user -d hrms_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hr_user:hr_password@postgres:5432/hrms
      - TEST_DATABASE_URL=postgresql://hr_user:hr_password@postgres_test:5432/hrms_test
      - JWT_SECRET_KEY=secret_key_for_dev
      - CHROMA_DB_PATH=/app/chroma_db
      - POLICY_UPLOAD_DIR=/app/uploads/policies
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_db
      - policy_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      postgres_test:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  postgres_test_data:
  chroma_data:
  policy_uploads:
